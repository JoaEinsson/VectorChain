[experiment]
name = "revisable-chain-development-validation"
phase = "stage12a-development-only"
scope = "development"
seeds = [11, 22]

[signals]
names = [
  "frequency_modulation",
  "baseline_modulation",
  "crest_asymmetry_modulation",
]
n_points = 4096
noise_std = 0.02

[split]
train_fraction = 0.5
validation_fraction = 0.2
inner_train_fraction = 0.8

[selection]
lambda_revision = [0.01, 0.1, 1.0]
lambda_bend = [0.01, 0.1, 1.0]
representation = "revisable_absolute"

[model]
kind = "ridge"
alpha = 0.001

[output]
root = "artifacts"
