[experiment]
name = "reconstruction-baseline"
seed = 1729
repetitions = 5
warmup_repetitions = 1

[signals]
names = [
  "sine",
  "chirp",
  "ramp",
  "piecewise_linear",
  "first_order_response",
  "second_order_response",
  "regime_change",
]
n_points = 1000
noise_std = 0.01

[signals.parameters.sine]
amplitude = 1.0
offset = 0.0
frequency = 3.0
phase = 0.0

[signals.parameters.chirp]
amplitude = 1.0
offset = 0.0
start_frequency = 1.0
end_frequency = 8.0
phase = 0.0

[signals.parameters.ramp]
amplitude = 1.0
offset = 0.0

[signals.parameters.piecewise_linear]
amplitude = 1.0
offset = 0.0

[signals.parameters.first_order_response]
amplitude = 1.0
offset = 0.0
time_constant = 0.15

[signals.parameters.second_order_response]
amplitude = 1.0
offset = 0.0
natural_frequency = 3.0
damping_ratio = 0.15

[signals.parameters.regime_change]
amplitude = 1.0
offset = 0.0
frequency_before = 2.0
frequency_after = 8.0
change_fraction = 0.5
level_shift = 0.5

[vectorchain]
causal = true
min_segment_length = 2
features = ["dt", "dy", "theta", "r", "delta_theta"]
tolerances = [0.001, 0.003, 0.01, 0.03, 0.1]

[metrics]
names = [
  "n_points",
  "n_vectors",
  "compression_factor",
  "retention_fraction",
  "mae",
  "rmse",
  "transform_runtime_median_s",
  "transform_runtime_q1_s",
  "transform_runtime_q3_s",
  "reconstruction_runtime_median_s",
  "reconstruction_runtime_q1_s",
  "reconstruction_runtime_q3_s",
]

[output]
root = "artifacts"
save_vectors = true
save_plots = true
plot_dpi = 150
